name: ci
on: [push, pull_request]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install
        working-directory: server
        run: pip install -e ".[dev]"
      - name: build native SIMD kernel (AVX2 on the runner)
        working-directory: server
        run: python -m cloudstore.erasure.native
      - name: tests
        working-directory: server
        run: python -m pytest -q
      - name: quick benchmarks (smoke)
        working-directory: server
        run: python -m benchmarks.run_all --quick --out /tmp/benchmarks.md && head -40 /tmp/benchmarks.md

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - working-directory: web
        run: npm ci && npm run build

  ios-kit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - working-directory: ios/CloudSyncKit
        run: swift test
